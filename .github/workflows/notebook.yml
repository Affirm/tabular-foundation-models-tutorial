name: Execute teaching notebook

on:
  pull_request:
    paths:
      - "materials/notebooks/**"
      - "materials/requirements.txt"
      - "materials/requirements-lock.txt"
      - ".github/workflows/notebook.yml"
  push:
    branches: [main]
    paths:
      - "materials/notebooks/**"
      - "materials/requirements.txt"
      - "materials/requirements-lock.txt"
      - ".github/workflows/notebook.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: materials/requirements-lock.txt

      - name: Install locked environment
        run: python -m pip install --require-hashes -r materials/requirements-lock.txt

      - name: Execute notebook from a clean kernel
        working-directory: materials/notebooks
        run: >-
          jupyter nbconvert 01_tabicl_primer.ipynb
          --to notebook
          --execute
          --inplace
          --ExecutePreprocessor.timeout=2400
          --ExecutePreprocessor.kernel_name=python3
